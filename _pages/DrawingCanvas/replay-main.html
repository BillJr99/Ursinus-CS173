<script LANGUAGE="JAVASCRIPT" TYPE="TEXT/JAVASCRIPT">

    function menuEntry(title, filename) {
        $('#menu').append(`
            <li class="custom-menu-item">
                <a class="custom-menu-link" href="javascript:void(0)" onClick="$('#fileContents').attr('src', '${filename}')">${title}</a>
            </li>
        `);
    }

    // jQuery function to create a dropdown menu entry using custom classes
    function dropdownEntry(title, options) {
        let $dropdown = $(`
            <li class="custom-dropdown custom-menu-item">
                <a href="javascript:void(0)" class="custom-dropbtn">${title}</a>
                <div class="custom-dropdown-content"></div>
            </li>
        `);
        options.forEach(option => {
            let $option = $(`<a href="javascript:void(0)" class="custom-dropdown-link">${option.title}</a>`);
            $option.on('click', function() {
                $('#fileContents').attr('src', option.url);
            });
            $dropdown.find('.custom-dropdown-content').append($option);
        });
        $('#menu').append($dropdown);
    }
