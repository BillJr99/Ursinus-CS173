name: Reset and sync submodules
on:
  workflow_dispatch:

jobs:
  reset-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Hard reset to remote HEAD
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: Wipe untracked content
        run: git clean -ffdx

      - name: Deinitialize all submodules
        run: git submodule deinit --all --force

      - name: Reinitialize submodules from remote
        run: git submodule update --init --recursive --remote --force

      - name: Build dynamic file_pattern from registered submodules
        id: submodule_paths
        run: |
          PATHS=$(git config --file .gitmodules --get-regexp 'submodule\..*\.path' \
                  | awk '{print $2}' \
                  | tr '\n' ' ' \
                  | sed 's/ $//')
          echo "paths=.gitmodules $PATHS" >> $GITHUB_OUTPUT

      - name: Commit updated submodule pointers if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: ${{ steps.submodule_paths.outputs.paths }}
          commit_message: "chore: hard reset submodule pointers to remote HEAD"
