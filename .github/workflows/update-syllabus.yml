name: Update ical

on:
  push:
    paths:
      - "_pages/syllabus.md"
      - "files/*.ics"
  pull_request:
    paths:
      - "_pages/syllabus.md"
      - "files/*.ics"

jobs:
  update_ical:
    name: Update ical
    runs-on: ubuntu-latest

    if: >
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade python-frontmatter python-dateutil

      - name: Build updated ical file
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            https://raw.githubusercontent.com/BillJr99/Ursinus-Boilerplate-Code/main/course/syllabus2ical.py \
            -o "$RUNNER_TEMP/syllabus2ical.py"
          python "$RUNNER_TEMP/syllabus2ical.py"

      - name: Commit new ical file
        # On a pull_request, checkout lands on the merge ref in detached HEAD and the
        # regenerated .ics leaves the tree dirty, so the action's checkout of the head
        # branch aborts. The commit only makes sense on a push to the real branch.
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: "files/*.ics"
          commit_message: "Update ical from syllabus [skip ci]"
